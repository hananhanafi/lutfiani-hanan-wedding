services:
  - type: web
    name: whatsapp-service
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: API_KEY
        sync: false
      - key: PORT
        value: 3001
      - key: WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
